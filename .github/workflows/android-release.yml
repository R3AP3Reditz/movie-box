name: Android release
run-name: Release v${{ inputs.version }} (build ${{ inputs.build_number }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v (for example, 1.0.3)'
        required: true
        type: string
      build_number:
        description: 'Android build number; must increase for each release (first release: 4)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate release inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" > "$RUNNER_TEMP/releases.json"
          python3 scripts/validate_release.py "$VERSION" "$BUILD_NUMBER" "$RUNNER_TEMP/releases.json"
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            echo "::error::Tag v$VERSION already exists; choose a new version."
            exit 1
          fi

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Check notices and release validation tests
        run: |
          python3 scripts/sync_notices.py --check
          python3 -m unittest discover -s scripts/tests -v

      - name: Check Flutter app
        working-directory: movie_box_app
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test

      - name: Build and verify production APK
        working-directory: movie_box_app
        env:
          MOVIE_BOX_KEYSTORE_BASE64: ${{ secrets.MOVIE_BOX_KEYSTORE_BASE64 }}
          MOVIE_BOX_STORE_PASSWORD: ${{ secrets.MOVIE_BOX_STORE_PASSWORD }}
          MOVIE_BOX_KEY_ALIAS: ${{ secrets.MOVIE_BOX_KEY_ALIAS }}
          MOVIE_BOX_KEY_PASSWORD: ${{ secrets.MOVIE_BOX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${MOVIE_BOX_KEYSTORE_BASE64:?Missing signing keystore secret}"
          : "${MOVIE_BOX_STORE_PASSWORD:?Missing store password secret}"
          : "${MOVIE_BOX_KEY_ALIAS:?Missing key alias secret}"
          : "${MOVIE_BOX_KEY_PASSWORD:?Missing key password secret}"
          export MOVIE_BOX_KEYSTORE_PATH="$RUNNER_TEMP/movie-box-release.p12"
          trap 'rm -f "$MOVIE_BOX_KEYSTORE_PATH" "$RUNNER_TEMP/release-certificate.der"' EXIT
          umask 077
          printf '%s' "$MOVIE_BOX_KEYSTORE_BASE64" | base64 --decode > "$MOVIE_BOX_KEYSTORE_PATH"
          unset MOVIE_BOX_KEYSTORE_BASE64
          flutter build apk --release --build-name "$VERSION" --build-number "$BUILD_NUMBER"
          apk=build/app/outputs/flutter-apk/app-release.apk
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apk-signature.txt"
          keytool -exportcert -keystore "$MOVIE_BOX_KEYSTORE_PATH" \
            -storepass:env MOVIE_BOX_STORE_PASSWORD -alias "$MOVIE_BOX_KEY_ALIAS" \
            -file "$RUNNER_TEMP/release-certificate.der"
          python3 ../scripts/verify_apk_certificate.py \
            "$RUNNER_TEMP/apk-signature.txt" "$RUNNER_TEMP/release-certificate.der"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/apk-badging.txt"
          if ! grep -F "versionCode='$BUILD_NUMBER' versionName='$VERSION'" "$RUNNER_TEMP/apk-badging.txt"; then
            echo '::error::APK version does not match the requested release.'
            exit 1
          fi
          if grep -q '^application-debuggable' "$RUNNER_TEMP/apk-badging.txt"; then
            echo '::error::Release APK must not be debuggable.'
            exit 1
          fi
          mkdir -p ../release
          cp "$apk" "../release/MovieBox-$VERSION.apk"
          cp "$RUNNER_TEMP/apk-signature.txt" ../release/signing-certificate.txt
          cd ../release
          sha256sum "MovieBox-$VERSION.apk" > SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release
          path: release/
          if-no-files-found: error
          retention-days: 7

  linux:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Linux libraries
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-14-dev libmpv-dev rpm
      - name: Build and package
        working-directory: movie_box_app
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter build linux --release --build-name "$VERSION" --build-number "${{ inputs.build_number }}"
          chmod +x ../scripts/package_linux.sh
          ../scripts/package_linux.sh "$VERSION" build/linux/x64/release/bundle ../release android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-release
          path: release/
          if-no-files-found: error
          retention-days: 7

  windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Build Windows app
        working-directory: movie_box_app
        run: |
          flutter pub get --enforce-lockfile
          flutter build windows --release --build-name "$env:VERSION" --build-number "${{ inputs.build_number }}"
          New-Item -ItemType Directory -Force -Path ../release | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "../release/MovieBox-$env:VERSION-windows-x64.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: release/
          if-no-files-found: error
          retention-days: 7

  macos:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Build macOS app
        working-directory: movie_box_app
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter build macos --release --build-name "$VERSION" --build-number "${{ inputs.build_number }}"
          mkdir -p ../release
          ditto -c -k --keepParent "build/macos/Build/Products/Release/movie_box_app.app" "../release/MovieBox-$VERSION-macos.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-release
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [build, linux, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '*-release'
          merge-multiple: true
          path: release

      - name: Publish GitHub release
        run: |
          set -euo pipefail
          cd release
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          printf 'Movie Box %s, build %s.\nSource commit: %s\n\nInstall one file:\n- Android: MovieBox-%s.apk\n- Windows: MovieBox-%s-windows-x64.zip\n- macOS: MovieBox-%s-macos.zip (unsigned)\n- Linux: MovieBox-%s-linux-x64.deb, .rpm, or .AppImage\n\nSHA256SUMS lists every file. signing-certificate.txt identifies the Android signing certificate.\n' \
            "$VERSION" "$BUILD_NUMBER" "$RELEASE_COMMIT" "$VERSION" "$VERSION" "$VERSION" "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          gh release create "v$VERSION" ./* \
            --target "$RELEASE_COMMIT" --title "MovieBox $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes --draft
          gh release edit "v$VERSION" --draft=false --latest
          printf '## Published MovieBox %s\n\nhttps://github.com/%s/releases/tag/v%s\n' \
            "$VERSION" "$GH_REPO" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
